plugins {
    id 'dev.hybridlabs.fabric'
    id 'org.jetbrains.kotlin.jvm'
}

dependencies {
    implementation("dev.hybridlabs.hapi:hapi-fabric-26.2:1.5.0")

    implementation "com.geckolib:geckolib-fabric-$geckolib_version"
}

fabricApi {
    configureDataGeneration {
        setModId("$mod_id")
        outputDirectory = file("src/generated/resources")
        client = true
    }
}

// runDatagen writes into src/generated/resources, which is part of the main sourceset.
// Without this ordering Gradle rejects a combined 'build runDatagen' invocation with an
// implicit-dependency validation error and datagen never gets a chance to run.
tasks.withType(Jar).configureEach {
    if (name == 'sourcesJar') mustRunAfter tasks.named('runDatagen')
}

publishMods.platforms.configureEach {
    requires 'fabric-api', 'fabric-language-kotlin', 'geckolib', 'hybrid-api'
}

// GeckoLib 5.5 moved to the com.geckolib group, which hybrid-gradle's GeckoLib repository
// filter does not include yet.
repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('com.geckolib')
        }
    }
}
